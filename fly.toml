# Deploy on Fly.io:  fly launch --copy-config --now
app = "still-together-classics"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
