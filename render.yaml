# One-click deploy on Render: use the button in README.md, or New > Blueprint.
services:
  - type: web
    name: still-together-classics
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
